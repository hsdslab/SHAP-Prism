name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", dependencies: verified }
          - { os: ubuntu-latest, python: "3.12", dependencies: latest }
          - { os: ubuntu-latest, python: "3.13", dependencies: latest }
          - { os: ubuntu-latest, python: "3.14", dependencies: latest }
          - { os: windows-latest, python: "3.12", dependencies: latest }
          - { os: macos-latest, python: "3.12", dependencies: latest }
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - if: matrix.dependencies == 'verified'
        run: |
          python -m pip install -r requirements-verified.txt
          python -m pip install --no-deps -e .
      - if: matrix.dependencies == 'latest'
        run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel install smoke test
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import matplotlib.pyplot as plt
          import numpy as np
          import pandas as pd
          import shap_prism

          assert shap_prism.__version__ == "0.4.4"
          values = np.array([[0.2, -0.1], [-0.3, 0.2], [0.1, 0.0], [0.0, -0.2]])
          features = pd.DataFrame(
              {"numeric": [1.0, 2.0, 3.0, 4.0], "category": ["A", "B", "A", "B"]}
          )
          with TemporaryDirectory() as directory:
              stem = Path(directory) / "installed-wheel-smoke"
              result = shap_prism.plot_summary(values, features, output=stem)
              assert stem.with_suffix(".png").is_file()
              assert stem.with_suffix(".pdf").is_file()
              plt.close(result.figure)
          PY
          .venv-wheel/bin/python -m pip check
      - name: Source distribution install smoke test
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import matplotlib.pyplot as plt
          import numpy as np
          import pandas as pd
          import shap_prism

          assert shap_prism.__version__ == "0.4.4"
          values = np.array([[0.2, -0.1], [-0.3, 0.2], [0.1, 0.0], [0.0, -0.2]])
          features = pd.DataFrame(
              {"numeric": [1.0, 2.0, 3.0, 4.0], "category": ["A", "B", "A", "B"]}
          )
          with TemporaryDirectory() as directory:
              stem = Path(directory) / "installed-sdist-smoke"
              result = shap_prism.plot_summary(values, features, output=stem)
              assert stem.with_suffix(".png").is_file()
              assert stem.with_suffix(".pdf").is_file()
              plt.close(result.figure)
          PY
          .venv-sdist/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
